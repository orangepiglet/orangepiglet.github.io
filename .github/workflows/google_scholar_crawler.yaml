name: Get Citation Data

on:
  page_build:
  workflow_dispatch:
  schedule:
    - cron: '0 0-4,8-23 * * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: google_scholar_crawler/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r google_scholar_crawler/requirements.txt

      - name: Run crawler
        env:
          GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}
        run: |
          cd google_scholar_crawler

          set +e
          timeout --kill-after=30s 3m python main.py
          status=$?
          set -e

          if [ "$status" -eq 124 ]; then
            echo "::warning::Google Scholar crawler timed out after 3 minutes. Skip this update."
            exit 0
          elif [ "$status" -ne 0 ]; then
            echo "::error::Crawler failed with exit code $status."
            exit "$status"
          fi

      - name: Push results
        run: |
          if [ ! -d "google_scholar_crawler/results" ]; then
            echo "::warning::No results directory found. Skip pushing citation data."
            exit 0
          fi

          cd google_scholar_crawler/results

          if ! compgen -G "*.json" > /dev/null; then
            echo "::warning::No JSON result files found. Skip pushing citation data."
            exit 0
          fi

          git init
          git config --local user.name "${GITHUB_ACTOR}"
          git config --local user.email "${GITHUB_ACTOR}@users.noreply.github.com"

          git add *.json

          if git diff --cached --quiet; then
            echo "No citation data changes."
            exit 0
          fi

          git commit -m "Updated Citation Data"

          export remote_repo="https://${GITHUB_ACTOR}:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git"
          git push "${remote_repo}" HEAD:google-scholar-stats --force

      - name: Purge jsDelivr cache
        run: |
          echo "Purging jsDelivr cache..."

          curl -fsS \
            "https://purge.jsdelivr.net/gh/orangepiglet/orangepiglet.github.io@google-scholar-stats/gs_data.json"

          curl -fsS \
            "https://purge.jsdelivr.net/gh/orangepiglet/orangepiglet.github.io@google-scholar-stats/gs_data_shieldsio.json"

          echo "jsDelivr cache purged."
